<section class="painel-pais-configuracoes">
  <header class="painel-header">
    <h2>⚙️ Configurações da Criança e Loja</h2>
    <p class="painel-descricao">Ajuste o nome do perfil e controle a disponibilidade dos cenários.</p>
  </header>

  <!-- Formulário de Perfil -->
  <form id="form-perfil-crianca" class="painel-form" onsubmit="salvarPerfilCrianca(event)">
    <div class="form-grupo">
      <label for="input-nome-crianca">Nome da Criança</label>
      <div class="input-com-botao">
        <input 
          type="text" 
          id="input-nome-crianca" 
          name="nomeCrianca" 
          placeholder="Ex: Bernardo" 
          maxlength="25" 
          required 
        />
        <button type="submit" class="btn-primario">Salvar Nome</button>
      </div>
      <small class="form-dica">Este nome aparecerá nos cabeçalhos, avisos e na aprovação de saques.</small>
    </div>
  </form>

  <hr class="divisor-painel" />

  <!-- Gerenciamento de Cenários -->
  <div class="gerenciamento-cenarios">
    <div class="cenarios-topo">
      <h3>🎨 Cenários Disponíveis</h3>
      <span class="tag-aviso">Alterações nos preços entram em vigor na hora</span>
    </div>

    <!-- Tabela responsiva de cenários -->
    <div class="tabela-cenarios-wrapper">
      <table class="tabela-cenarios">
        <thead>
          <tr>
            <th>Cenário</th>
            <th>Preço (🪙)</th>
            <th>Desbloqueado?</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-cenarios-pais">
          <!-- Linhas renderizadas via JS -->
        </tbody>
      </table>
    </div>
  </div>
</section>
